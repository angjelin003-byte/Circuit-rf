<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="50%" stop-color="#0d1527"/>
      <stop offset="100%" stop-color="#050811"/>
    </linearGradient>
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="neonAmber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="neonEmerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background with subtle bezel -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="#1e293b" stroke-width="4"/>

  <!-- Smith Chart Outer Circle (R=0) -->
  <circle cx="256" cy="256" r="180" fill="#080e1a" stroke="#1e3a5f" stroke-width="3"/>

  <!-- Smith Chart Horizontal Real Axis -->
  <line x1="76" y1="256" x2="436" y2="256" stroke="#2563eb" stroke-width="2" opacity="0.6"/>

  <!-- Constant Resistance Circles (Passing through Infinity at x=436, y=256) -->
  <!-- r=0.5 -> center (316, 256), radius 120 -->
  <circle cx="316" cy="256" r="120" fill="none" stroke="#1e3a5f" stroke-width="1.8" opacity="0.75"/>
  <!-- r=1.0 (50 Ohm circle) -> center (346, 256), radius 90 -->
  <circle cx="346" cy="256" r="90" fill="none" stroke="#0ea5e9" stroke-width="2.5" opacity="0.85"/>
  <!-- r=2.0 -> center (376, 256), radius 60 -->
  <circle cx="376" cy="256" r="60" fill="none" stroke="#1e3a5f" stroke-width="1.8" opacity="0.75"/>
  <!-- r=5.0 -> center (406, 256), radius 30 -->
  <circle cx="406" cy="256" r="30" fill="none" stroke="#1e3a5f" stroke-width="1.5" opacity="0.6"/>

  <!-- Constant Reactance Arcs -->
  <!-- Upper inductive x=+1.0 -->
  <path d="M 436 256 A 90 90 0 0 0 346 166" fill="none" stroke="#1e3a5f" stroke-width="1.8" opacity="0.75"/>
  <!-- Lower capacitive x=-1.0 -->
  <path d="M 436 256 A 90 90 0 0 1 346 346" fill="none" stroke="#1e3a5f" stroke-width="1.8" opacity="0.75"/>
  <!-- Upper x=+0.5 -->
  <path d="M 436 256 A 180 180 0 0 0 256 76" fill="none" stroke="#1e3a5f" stroke-width="1.5" opacity="0.6"/>
  <!-- Lower x=-0.5 -->
  <path d="M 436 256 A 180 180 0 0 1 256 436" fill="none" stroke="#1e3a5f" stroke-width="1.5" opacity="0.6"/>

  <!-- RF Spiral / Trajectory Trace (S11 matching locus) -->
  <path d="M 120 220 C 180 130, 290 140, 310 210 C 325 260, 360 280, 346 256" 
        fill="none" stroke="url(#neonCyan)" stroke-width="5" stroke-linecap="round" filter="url(#glow)"/>

  <!-- Center Prime Match Point (50 Ohm / normalized 1.0) -->
  <circle cx="256" cy="256" r="7" fill="#38bdf8" filter="url(#glow)"/>
  <circle cx="256" cy="256" r="3" fill="#ffffff"/>

  <!-- Current Target Impedance Marker -->
  <circle cx="346" cy="256" r="9" fill="#f59e0b" filter="url(#glow)"/>
  <circle cx="346" cy="256" r="4" fill="#ffffff"/>

  <!-- High frequency RF Waveform Accent at Bottom -->
  <path d="M 110 440 Q 140 410 170 440 T 230 440 T 290 440 T 350 440 T 410 440" 
        fill="none" stroke="url(#neonEmerald)" stroke-width="3" opacity="0.85" stroke-linecap="round"/>

  <!-- "RF" Typography Badge -->
  <rect x="206" y="28" width="100" height="34" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
  <text x="256" y="52" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="19" text-anchor="middle" letter-spacing="2">CIRCUIT RF</text>
</svg>
