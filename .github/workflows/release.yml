name: CircuitRF Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Tests
        run: npm test

      - name: Build Web App
        run: npm run build

      - name: Package Dist Archive
        run: |
          tar -czf circuitrf-mobile-web-${{ github.ref_name }}.tar.gz -C dist .
          zip -r circuitrf-mobile-web-${{ github.ref_name }}.zip dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            circuitrf-mobile-web-${{ github.ref_name }}.tar.gz
            circuitrf-mobile-web-${{ github.ref_name }}.zip
          generate_release_notes: true
