name: CircuitRF Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Run Tests
        run: npm test

      - name: Build Web App
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Build Android Debug APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug --no-daemon
          cd ..
          cp android/app/build/outputs/apk/debug/app-debug.apk circuitrf-v${{ github.ref_name }}-debug.apk

      - name: Package Dist Archive
        run: |
          tar -czf circuitrf-mobile-web-${{ github.ref_name }}.tar.gz -C dist .
          zip -r circuitrf-mobile-web-${{ github.ref_name }}.zip dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            circuitrf-v${{ github.ref_name }}-debug.apk
            circuitrf-mobile-web-${{ github.ref_name }}.tar.gz
            circuitrf-mobile-web-${{ github.ref_name }}.zip
          generate_release_notes: true
