name: Build Android APK (Debug)

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22.x

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Node Dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Build Web Application
        run: npm run build

      - name: Prepare and Sync Capacitor Android Project
        run: |
          if [ ! -d "android" ] || [ ! -f "android/gradlew" ]; then
            echo "Android platform not found in repo checkout. Initializing Capacitor Android..."
            npx cap add android
          else
            echo "Existing Android platform detected. Synchronizing assets..."
            npx cap sync android
          fi

      - name: Grant Execute Permission to gradlew
        run: |
          chmod +x android/gradlew
          ls -la android/gradlew

      - name: Accept Android SDK Licenses
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      - name: Build Android Debug APK with Gradle
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Prepare APK Output
        run: |
          mkdir -p apk-output
          cp android/app/build/outputs/apk/debug/app-debug.apk apk-output/circuitrf-debug.apk
          ls -lh apk-output/

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: circuitrf-debug-apk
          path: apk-output/circuitrf-debug.apk
          retention-days: 30

      - name: Attach APK to GitHub Release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: apk-output/circuitrf-debug.apk
